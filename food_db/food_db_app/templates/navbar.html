{% load static %}
<div id="logo_header">
    <a href="{% url 'index' %}"><img id="logo_img" src="{% static 'img/logo.png' %}"></img></a>
    <h1 id="logo_title">Food DB{% if potty_mouth %}, biiiitch{% endif %}</h1>
    <label class="slider_switch" id="baking_switch_label">
        <input type="checkbox" id="cooking_baking_switch" {% if current_is_baking_mode == 'True' %}checked{% endif %}>
        <div class="slider">
            <span class="on">Baking</span>
            <span class="off">Cooking</span>
        </div>
    </label>
</div>
<br>
<br style="clear:both" />
<!-- Using url and not url_with_test_db because I want these navbar links to reset us out of the test DB back into the default DB -->
<a class="navbar left_side_of_page" href="{% url 'index' %}">Home</a> | 
<a class="navbar" href="{% url 'add_recipe' %}">Add a new recipe</a> | 
<a class="navbar" href="{% url 'search' %}">Recipes</a> |
<a class="navbar" href="{% url 'manage_food' %}">Food Manager</a> | 
<a class="navbar" href="{% url 'help' %}">Help</a> |
<a class="navbar" href="{% url 'bulk_prep' %}">Bulk Prep</a> <span {% if cart|length <= 0 %}style="display: none;" {% endif %}id="cart_size">{{ cart|length }}</span>
<hr>
